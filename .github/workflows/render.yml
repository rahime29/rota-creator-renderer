name: Render Rota Creator Video

on:
  workflow_dispatch:
    inputs:
      props_base64:
        description: "Base64 encoded Remotion input props"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render Dynamic MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create output directory
        run: mkdir -p out

      - name: Decode render input
        env:
          PROPS_BASE64: ${{ inputs.props_base64 }}
        run: |
          if [ -z "$PROPS_BASE64" ]; then
            echo "props_base64 is empty"
            exit 1
          fi

          printf '%s' "$PROPS_BASE64" \
            | base64 --decode \
            > render-input.json

      - name: Validate render input
        run: |
          jq empty render-input.json
          echo "Render input is valid JSON"
          jq '.video, .settings' render-input.json

      - name: Render dynamic video
        run: |
          npx remotion render \
            src/index.ts \
            RotaCreatorShort \
            out/rota-creator-video.mp4 \
            --props=render-input.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --log=verbose

      - name: Verify rendered video
        run: |
          test -f out/rota-creator-video.mp4
          ls -lh out/rota-creator-video.mp4

      - name: Upload video to Cloudinary
        id: cloudinary_upload
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          TIMESTAMP=$(date +%s)

          SIGNATURE=$(printf "timestamp=%s%s" \
            "$TIMESTAMP" \
            "$CLOUDINARY_API_SECRET" \
            | openssl sha1 | awk '{print $2}')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload" \
            -F "file=@out/rota-creator-video.mp4" \
            -F "api_key=${CLOUDINARY_API_KEY}" \
            -F "timestamp=${TIMESTAMP}" \
            -F "signature=${SIGNATURE}")

          echo "$RESPONSE" > cloudinary-response.json

          SECURE_URL=$(echo "$RESPONSE" | jq -r '.secure_url')
          PUBLIC_ID=$(echo "$RESPONSE" | jq -r '.public_id')

          if [ -z "$SECURE_URL" ] || [ "$SECURE_URL" = "null" ]; then
            echo "Cloudinary upload failed:"
            cat cloudinary-response.json
            exit 1
          fi

          echo "secure_url=$SECURE_URL" >> "$GITHUB_OUTPUT"
          echo "public_id=$PUBLIC_ID" >> "$GITHUB_OUTPUT"

          echo "Cloudinary upload successful"
          echo "Video URL: $SECURE_URL"

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-creator-rendered-video
          path: out/rota-creator-video.mp4
          if-no-files-found: error
          retention-days: 7
