name: Render Rota Creator Video

on:
  workflow_dispatch:
    inputs:
      props_url:
        description: "Public URL of the Remotion input props JSON"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render Dynamic MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create output directory
        run: mkdir -p out

      - name: Download render input
        env:
          PROPS_URL: ${{ inputs.props_url }}
        run: |
          if [ -z "$PROPS_URL" ]; then
            echo "props_url is empty"
            exit 1
          fi

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            "$PROPS_URL" \
            --output render-input.json

      - name: Validate render input
        run: |
          jq empty render-input.json
          echo "Render input is valid JSON"
          jq '.video, .settings' render-input.json

      - name: Render dynamic video
        run: |
          npx remotion render \
            src/index.ts \
            RotaCreatorShort \
            out/rota-creator-video.mp4 \
            --props=render-input.json \
            --codec=h264 \
            --pixel-format=yuv420p \
            --log=verbose

      - name: Verify rendered video
        run: |
          test -f out/rota-creator-video.mp4
          ls -lh out/rota-creator-video.mp4

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rota-creator-rendered-video
          path: out/rota-creator-video.mp4
          if-no-files-found: error
          retention-days: 7
